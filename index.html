<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لكِ يا إيسو ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Tahoma, sans-serif;

            background:
                radial-gradient(circle at top, #fff5f8, transparent 40%),
                linear-gradient(135deg, #ffb6cc, #ffddea, #f8c8dc);

            overflow: hidden;
            color: #4a2432;
        }

        .heart {
            position: fixed;
            bottom: -40px;
            font-size: 22px;
            animation: floatUp 7s linear forwards;
            opacity: 0.7;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.7) rotate(0deg);
                opacity: 0;
            }

            15% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-110vh) scale(1.3) rotate(25deg);
                opacity: 0;
            }
        }

        .card {
            width: 90%;
            max-width: 470px;
            padding: 38px 25px;
            text-align: center;

            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 30px;

            box-shadow:
                0 20px 60px rgba(130, 40, 75, 0.22);

            backdrop-filter: blur(12px);
            position: relative;
            z-index: 5;
            animation: cardIn 1s ease;
        }

        @keyframes cardIn {
            from {
                transform: scale(0.85);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            color: #d6336c;
            font-size: 36px;
            margin: 5px 0 20px;
        }

        p {
            font-size: 19px;
            line-height: 2;
            margin: 10px 0;
        }

        .small {
            color: #8c5368;
            font-size: 16px;
        }

        button {
            margin-top: 22px;
            padding: 15px 30px;
            border: none;
            border-radius: 40px;

            background: linear-gradient(135deg, #d6336c, #ef6f9b);

            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(214, 51, 108, 0.3);

            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px) scale(1.04);
        }

        .hidden {
            display: none;
        }

        .counter {
            color: #b05a78;
            font-size: 14px;
            margin-top: 18px;
        }

        .teddy {
            position: relative;
            width: 170px;
            height: 170px;
            margin: 10px auto 20px;
        }

        .ear {
            position: absolute;
            width: 55px;
            height: 55px;
            background: #b87955;
            border-radius: 50%;
            top: 10px;
            z-index: 1;
        }

        .ear.left {
            left: 5px;
        }

        .ear.right {
            right: 5px;
        }

        .head {
            position: absolute;
            width: 135px;
            height: 125px;
            background: #c98b66;
            border-radius: 50%;
            top: 25px;
            left: 18px;
            z-index: 2;

            box-shadow:
                inset 0 -8px 0 rgba(100, 50, 30, 0.08);
        }

        .eye {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #34201b;
            border-radius: 50%;
            top: 48px;
        }
