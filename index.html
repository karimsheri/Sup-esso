<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لكِ يا إيسو ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Tahoma, sans-serif;

            background:
                radial-gradient(circle at top, #fff5f8, transparent 40%),
                linear-gradient(135deg, #ffb6cc, #ffddea, #f8c8dc);

            overflow: hidden;
            color: #4a2432;
        }

        /* القلوب اللي في الخلفية */

        .heart {
            position: fixed;
            bottom: -40px;

            font-size: 22px;

            animation: floatUp 7s linear forwards;

            opacity: 0.7;

            pointer-events: none;
        }

        @keyframes floatUp {

            0% {
                transform: translateY(0) scale(0.7) rotate(0deg);
                opacity: 0;
            }

            15% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-110vh) scale(1.3) rotate(25deg);
                opacity: 0;
            }

        }


        /* الكارت */

        .card {

            width: 90%;
            max-width: 470px;

            padding: 38px 25px;

            text-align: center;

            background: rgba(255, 255, 255, 0.88);

            border: 1px solid rgba(255, 255, 255, 0.9);

            border-radius: 30px;

            box-shadow:
                0 20px 60px rgba(130, 40, 75, 0.22);

            backdrop-filter: blur(12px);

            position: relative;

            z-index: 5;

            animation: cardIn 1s ease;

        }

        @keyframes cardIn {

            from {
                transform: scale(0.85);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }

        }


        h1 {

            color: #d6336c;

            font-size: 36px;

            margin: 5px 0 20px;

        }

        p {

            font-size: 19px;

            line-height: 2;

            margin: 10px 0;

        }


        .small {

            color: #8c5368;

            font-size: 16px;

        }


        button {

            margin-top: 22px;

            padding: 15px 30px;

            border: none;

            border-radius: 40px;

            background: linear-gradient(135deg, #d6336c, #ef6f9b);

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 8px 20px rgba(214, 51, 108, 0.3);

            transition: 0.3s;

        }

        button:hover {

            transform: translateY(-3px) scale(1.04);

        }


        .hidden {
            display: none;
        }


        /* مؤشر الرسائل */

        .counter {

            color: #b05a78;

            font-size: 14px;

            margin-top: 18px;

        }


        /* الدبدوب */

        .teddy {

            position: relative;

            width: 170px;

            height: 170px;

            margin: 10px auto 20px;

        }


        .ear {

            position: absolute;

            width: 55px;

            height: 55px;

            background: #b87955;

            border-radius: 50%;

            top: 10px;

            z-index: 1;

        }

        .ear.left {
            left: 5px;
        }

        .ear.right {
            right: 5px;
        }


        .head {

            position: absolute;

            width: 135px;

            height: 125px;

            background: #c98b66;

            border-radius: 50%;

            top: 25px;

            left: 18px;

            z-index: 2;

            box-shadow: inset 0 -8px 0 rgba(100, 50, 30, 0.08);

        }


        .eye {

            position: absolute;

            width: 12px;

            height: 12px;

            background: #34201b;

            border-radius: 50%;

            top: 48px;

        }

        .eye.left {
            left: 38px;
        }

        .eye.right {
            right: 38px;
        }


        .nose {

            position: absolute;

            width: 23px;

            height: 17px;

            background: #513027;

            border-radius: 50%;

            top: 67px;

            left: 56px;

        }


        .mouth {

            position: absolute;

            width: 25px;

            height: 12px;

            border-bottom: 3px solid #513027;

            border-radius: 50%;

            top: 80px;

            left: 55px;

        }


        .arm {

            position: absolute;

            width: 45px;

            height: 75px;

            background: #b87955;

            border-radius: 30px;

            top: 75px;

            z-index: 1;

        }

        .arm.left {
            left: -2px;
        }

        .arm.right {
            right: -2px;
        }


        /* حركة البوسة */

        .kiss {

            position: absolute;

            font-size: 35px;

            top: 40px;

            left: 50%;

            opacity: 0;

        }


        .kiss.animate {

            animation: kissMove 2s ease forwards;

        }


        @keyframes kissMove {

            0% {
                transform: translate(-50%, 40px) scale(0.5);
                opacity: 0;
            }

            30% {
                opacity: 1;
            }

            100% {
                transform: translate(80px, -80px) scale(1.4);
                opacity: 0;
            }

        }


        .finalText {

            font-size: 32px;

            font-weight: bold;

            color: #d6336c;

            animation: loveIn 1.5s ease;

        }


        @keyframes loveIn {

            from {
                transform: scale(0.4);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }

        }


        .signature {

            color: #8c5368;

            margin-top: 20px;

        }

    </style>
</head>


<body>


    <div class="card">


        <!-- البداية -->

        <div id="start">

            <div style="font-size:55px;">💗</div>

            <h1>يا إيسو ❤️</h1>

            <p>
                عملتلك حاجة صغيرة كده...
                <br>
                بس هي من قلبي بجد.
            </p>

            <p class="small">
                افتحيها للآخر يا ست البنات ✨
            </p>

            <button onclick="startSurprise()">
                ابدأي المفاجأة ❤️
            </button>

        </div>


        <!-- الرسائل -->

        <div id="messageBox" class="hidden">

            <div style="font-size:45px;" id="emoji">❤️</div>

            <h1 id="title"></h1>

            <p id="message"></p>

            <button onclick="nextMessage()">
                كملي ✨
            </button>

            <div class="counter" id="counter"></div>

        </div>


        <!-- النهاية -->

        <div id="end" class="hidden">

            <div class="teddy">

                <div class="ear left"></div>
                <div class="ear right"></div>

                <div class="arm left"></div>
                <div class="arm right"></div>

                <div class="head">

                    <div class="eye left"></div>
                    <div class="eye right"></div>

                    <div class="nose"></div>

                    <div class="mouth"></div>

                </div>

                <div class="kiss" id="kiss">💋</div>

            </div>


            <h1 class="finalText">
                I LOVE U ESSO ❤️
            </h1>

            <p>
                هفضل جنبك طول العمر
                <br>
                يا أحلى وأغلى حاجة في حياتي.
                <br><br>
                بعشقكككك ❤️
            </p>

            <p class="signature">
                — كوتي بتاعك 😂❤️
            </p>

        </div>


    </div>


    <script>


        let currentMessage = 0;


        const messages = [

            {
                emoji: "🥹❤️",

                title: "إنتي عارفة إنتي إيه؟",

                text:
                "إنتي من أطيب وأحن وأجدع وأحترم الناس اللي قابلتهم في حياتي. بجد بحس إن مفيكيش غلطة، وإنك من أجمل الأشخاص اللي شوفتهم في حياتي."
            },


            {
                emoji: "🤍",

                title: "أكتر حاجة بحبها فيكي",

                text:
                "إنك أكتر حد بحس منه إنه بيحبني بجد ومن غير ما يكون مستني مني مقابل. بتستحمليني وأنا متعصب أو مضايق، ودايمًا بتسمعيني وتهتمي بيا وتحاولي تخففي عني."
            },


            {
                emoji: "🫂",

                title: "معاكي أنا أنا بجد",

                text:
                "معاكي بحس إن كل حاجة حقيقية. بحس إني مطمن ومرتاح، وبحكي من غير ما أفضل أراعي كل كلمة بقولها. اللي في قلبي بقوله، وببقى أنا بجد وأنا معاكي."
            },


            {
                emoji: "❤️",

                title: "كلمة شكراً قليلة",

                text:
                "شكراً على كل حاجة عملتيها معايا، وعلى تشجيعك، وعلى اهتمامك، وعلى كل مرة حاولتي تخففي عني فيها. وجودك في حياتي فارق معايا أكتر مما تتخيلي."
            },


            {
                emoji: "🥹💗",

                title: "ولو الأيام فرقتنا...",

                text:
                "حتى لو في يوم بعد الف الشهر بعدنا، عمري ما هنساكي ولا هنسى أي حاجة عملتيها ليا. وهفضل لازق فيكي متخفيش 😂❤️"
            },


            {
                emoji: "👑❤️",

                title: "آخر حاجة يا ست البنات",

                text:
                "بحبك أوي يا إيسو، وبموت فيكي. وهفضل جنبك طول العمر يا أحلى وأغلى حاجة في حياتي. إنتي غالية عندي أوي."
            }

        ];


        function startSurprise() {

            document.getElementById("start")
                .classList.add("hidden");

            document.getElementById("messageBox")
                .classList.remove("hidden");

            showMessage();

            createHearts();

        }


        function showMessage() {

            document.getElementById("title").innerText =
                messages[currentMessage].title;

            document.getElementById("message").innerText =
                messages[currentMessage].text;

            document.getElementById("emoji").innerText =
                messages[currentMessage].emoji;

            document.getElementById("counter").innerText =
                (currentMessage + 1) +
                " / " +
                messages.length;

        }


        function nextMessage() {

            currentMessage++;


            if (currentMessage >= messages.length) {

                document.getElementById("messageBox")
                    .classList.add("hidden");

                document.getElementById("end")
                    .classList.remove("hidden");

                document.getElementById("kiss")
                    .classList.add("animate");

                createExtraHearts();

            }

            else {

                showMessage();

            }

        }


        function createHearts() {

            setInterval(function() {

                const heart =
                    document.createElement("div");

                heart.className = "heart";

                const hearts = [
                    "❤️",
                    "💗",
                    "💕",
                    "💖",
                    "✨"
                ];

                heart.innerText =
                    hearts[
                        Math.floor(
                            Math.random() * hearts.length
                        )
                    ];

                heart.style.left =
                    Math.random() * 100 + "vw";

                heart.style.animationDuration =
                    (4 + Math.random() * 4) + "s";

                document.body.appendChild(heart);


                setTimeout(function() {

                    heart.remove();

                }, 8000);


            }, 650);

        }


        function createExtraHearts() {

            for (let i = 0; i < 25; i++) {

                setTimeout(function() {

                    const heart =
                        document.createElement("div");

                    heart.className = "heart";

                    heart.innerText = "❤️";

                    heart.style.left =
                        Math.random() * 100 + "vw";

                    heart.style.animationDuration =
                        (3 + Math.random() * 3) + "s";

                    document.body.appendChild(heart);

                }, i * 120);

            }

        }


    </script>

</body>

</html>
